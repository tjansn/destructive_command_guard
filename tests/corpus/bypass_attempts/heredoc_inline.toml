# Bypass attempts: destructive commands in heredocs and inline scripts
#
# These commands embed destructive operations inside heredocs, here-strings,
# or inline script execution. The heredoc scanner should detect these.
#
# NOTE: This file contains ONLY commands expected to be DENIED.
# Safe variants are in edge_cases/ or false_positives/ directories.
# NOTE: Some patterns require heredoc scanning enabled in config.

# ============================================================================
# Python inline execution (-c flag) - DESTRUCTIVE ONLY
# ============================================================================

[[case]]
description = "python -c with shutil.rmtree (destructive)"
command = "python -c \"import shutil; shutil.rmtree('/home/user')\""
expected = "deny"

[[case]]
description = "python3 -c with os.remove (potentially destructive)"
command = "python3 -c \"import os; os.remove('/etc/passwd')\""
expected = "deny"

# Value-taking flags whose value is NOT a clean bareword (it contains '::') must
# not let the inline -c slip past Tier-1/Tier-2 — these would ALLOW under a
# bareword-only flag-value token (the under-block fixed alongside these cases).
[[case]]
description = "python -W <filter> -c with shutil.rmtree (non-bareword value)"
command = "python -W ignore::DeprecationWarning -c \"import shutil; shutil.rmtree('/home/user')\""
expected = "deny"

[[case]]
description = "python3 -W <filter> -c with os.remove (non-bareword value)"
command = "python3 -W error::DeprecationWarning -c \"import os; os.remove('/etc/passwd')\""
expected = "deny"

[[case]]
description = "python -c with subprocess git reset"
command = "python -c \"import subprocess; subprocess.run(['git', 'reset', '--hard'])\""
expected = "deny"

# Issue #549: the temp cleanup exemption requires an actual descendant.
# These are verdict-only fixtures: AST and bounded fallback attribution may
# differ, but deleting a shared temp root must never become an allow.
[[case]]
description = "python rmtree cannot delete the tmp root"
command = "python3 -c \"import shutil; shutil.rmtree('/tmp')\""
expected = "deny"

[[case]]
description = "python rmtree cannot delete tmp with a trailing slash"
command = "python3 -c \"import shutil; shutil.rmtree('/tmp/')\""
expected = "deny"

[[case]]
description = "python rmtree cannot delete tmp with a dot suffix"
command = "python3 -c \"import shutil; shutil.rmtree('/tmp/.')\""
expected = "deny"

[[case]]
description = "python rmtree cannot delete the private tmp root alias"
command = "python3 -c \"import shutil; shutil.rmtree('/private/tmp')\""
expected = "deny"

[[case]]
description = "python rmtree cannot delete the var tmp root"
command = "python3 -c \"import shutil; shutil.rmtree('/var/tmp')\""
expected = "deny"

[[case]]
description = "python rmtree cannot delete the private var tmp root alias"
command = "python3 -c \"import shutil; shutil.rmtree('/private/var/tmp')\""
expected = "deny"

[[case]]
description = "python rmtree rejects a root suffix made only of dots and separators"
command = "python3 -c \"import shutil; shutil.rmtree('/private/tmp//.//./')\""
expected = "deny"

[[case]]
description = "python rmtree rejects normalized components within the root alias"
command = "python3 -I -c \"import shutil; shutil.rmtree('/private/./var//tmp/.')\""
expected = "deny"

[[case]]
description = "python rmtree rejects parent traversal back to the temp root"
command = "python3 -c \"import shutil; shutil.rmtree('/tmp/build/..')\""
expected = "deny"

[[case]]
description = "python rmtree rejects traversal from tmp into etc"
command = "python3 -c \"import shutil; shutil.rmtree('/tmp/../etc')\""
expected = "deny"

[[case]]
description = "python rmtree rejects traversal from a private temp alias into etc"
command = "python3 -c \"import shutil as sh; sh.rmtree('/private/var/tmp/../../../etc')\""
expected = "deny"

[[case]]
description = "python rmtree preserves the no-parent-traversal cleanup policy"
command = "python3 -c \"import shutil; shutil.rmtree('/tmp/build/../cache')\""
expected = "deny"

[[case]]
description = "python rmtree cannot normalize traversal back into a temp exemption"
command = "python3 -c \"import shutil; shutil.rmtree('/tmp/../tmp/build')\""
expected = "deny"

[[case]]
description = "python rmtree requires a complete temp root component"
command = "python3 -c \"import shutil; shutil.rmtree('/tmp-backup/build')\""
expected = "deny"

[[case]]
description = "python stdin heredoc cannot delete the tmp root"
command = "python3 - <<'PY'\nimport shutil\nshutil.rmtree('/tmp')\nPY"
expected = "deny"

[[case]]
description = "python heredoc module alias cannot delete var tmp with trailing slash"
command = "python3 <<'PY'\nimport shutil as sh\nsh.rmtree('/var/tmp/')\nPY"
expected = "deny"

[[case]]
description = "python stdin heredoc cannot delete a dot-normalized private tmp root"
command = "python3 - <<'PY'\nimport shutil\nshutil.rmtree('/private/tmp/.')\nPY"
expected = "deny"

[[case]]
description = "isolated Python stdin heredoc cannot delete private var tmp"
command = "python3 -I - <<'PY'\nimport shutil\nshutil.rmtree('/private/var/tmp')\nPY"
expected = "deny"

# Imported functions must receive the same path policy as shutil.rmtree.
# These fixtures assert only completed verdicts, independent of attribution.
[[case]]
description = "directly imported python rmtree cannot delete the tmp root"
command = "python3 -c \"from shutil import rmtree; rmtree('/tmp')\""
expected = "deny"

[[case]]
description = "renamed python rmtree cannot delete the var tmp root"
command = "python3 -c \"from shutil import rmtree as wipe; wipe('/var/tmp')\""
expected = "deny"

[[case]]
description = "renamed python rmtree rejects a normalized private temporary root"
command = "python3 -c \"from shutil import rmtree as wipe; wipe('/private/./var//tmp/.')\""
expected = "deny"

[[case]]
description = "python rmtree in a grouped import still protects the temporary root"
command = "python3 -c \"from shutil import copytree, rmtree as wipe; wipe('/private/tmp')\""
expected = "deny"

[[case]]
description = "multiline parenthesized python import protects the temporary root in a heredoc"
command = "python3 - <<'PY'\nfrom shutil import (\n    copytree,\n    rmtree as wipe,\n)\nwipe('/tmp/.')\nPY"
expected = "deny"

[[case]]
description = "renamed python rmtree rejects traversal into a sensitive directory"
command = "python3 -c \"from shutil import rmtree as wipe; wipe('/tmp/../etc')\""
expected = "deny"

[[case]]
description = "renamed python rmtree rejects parent traversal that stays in tmp"
command = "python3 -c \"from shutil import rmtree as wipe; wipe('/tmp/build/../cache')\""
expected = "deny"

[[case]]
description = "renamed python rmtree protects a non-temporary directory"
command = "python3 -c \"from shutil import rmtree as wipe; wipe('/home/user/Documents')\""
expected = "deny"

[[case]]
description = "renamed python rmtree checks its keyword target"
command = "python3 -c \"from shutil import rmtree as wipe; wipe(path='/tmp')\""
expected = "deny"

[[case]]
description = "renamed python rmtree cannot borrow a temporary path prefix"
command = "python3 -c \"from shutil import rmtree as wipe; wipe('/tmp/build' + '/..')\""
expected = "deny"

[[case]]
description = "python function-local rmtree import protects the temporary root"
command = "python3 - <<'PY'\ndef cleanup():\n    from shutil import rmtree as wipe\n    wipe('/tmp')\ncleanup()\nPY"
expected = "deny"

[[case]]
description = "conditional python reassignment cannot hide a possible destructive binding"
command = "python3 - <<'PY'\nimport os\nfrom shutil import rmtree as wipe\nif os.getenv('DRY_RUN'):\n    wipe = print\nwipe('/tmp')\nPY"
expected = "deny"

# ============================================================================
# Bash inline execution (-c flag) - DESTRUCTIVE ONLY
# ============================================================================

[[case]]
description = "bash -c with rm -rf (destructive)"
command = "bash -c 'rm -rf /home/user'"
expected = "deny"

[[case]]
description = "bash -c with git reset --hard (destructive)"
command = "bash -c 'git reset --hard'"
expected = "deny"
rule_id = "core.git:reset-hard"

[[case]]
description = "sh -c with rm -rf (destructive)"
command = "sh -c 'rm -rf /home/user'"
expected = "deny"

[[case]]
description = "zsh -c with git clean -fd (destructive)"
command = "zsh -c 'git clean -fd'"
expected = "deny"
rule_id = "core.git:clean-force"

# ============================================================================
# Node.js inline execution (-e flag) - DESTRUCTIVE ONLY
# ============================================================================

[[case]]
description = "node -e with fs.rmSync (destructive)"
command = "node -e \"require('fs').rmSync('/home/user', {recursive: true})\""
expected = "deny"

[[case]]
description = "node -e with child_process rm (destructive)"
command = "node -e \"require('child_process').execSync('rm -rf /')\""
expected = "deny"

# ============================================================================
# Ruby inline execution (-e flag) - DESTRUCTIVE ONLY
# ============================================================================

[[case]]
description = "ruby -e with FileUtils.rm_rf (destructive)"
command = "ruby -e \"require 'fileutils'; FileUtils.rm_rf('/home/user')\""
expected = "deny"

[[case]]
description = "ruby -e with backtick rm (destructive)"
command = "ruby -e \"`rm -rf /home/user`\""
expected = "deny"

# ============================================================================
# Perl inline execution (-e flag) - DESTRUCTIVE ONLY
# ============================================================================

[[case]]
description = "perl -e with system rm (destructive)"
command = "perl -e \"system('rm -rf /home/user')\""
expected = "deny"

[[case]]
description = "perl -e with unlink (file deletion)"
command = "perl -e \"unlink '/etc/passwd'\""
expected = "deny"

# ============================================================================
# Heredocs (bash style) - DESTRUCTIVE ONLY
# ============================================================================
#
# NOTE: Heredocs to non-executing commands like `cat`, `tee`, etc. are DATA,
# not CODE. They are correctly allowed and tested in false_positives/heredoc_data.toml.
# Only heredocs to executing commands like `bash`, `sh`, `python` should be blocked.

[[case]]
description = "heredoc to bash containing git reset"
command = "bash <<EOF\ngit reset --hard\nEOF"
expected = "deny"
rule_id = "core.git:reset-hard"

[[case]]
description = "heredoc to sh containing rm -rf"
command = "sh <<EOF\nrm -rf /home/user\nEOF"
expected = "deny"

# ============================================================================
# Here-strings (<<<) to executing commands - DESTRUCTIVE
# ============================================================================
#
# Here-strings to shells ARE executed and should be blocked.

[[case]]
description = "bash here-string with rm -rf"
command = "bash <<<'rm -rf /home/user'"
expected = "deny"

[[case]]
description = "sh here-string with git reset"
command = "sh <<<'git reset --hard'"
expected = "deny"
rule_id = "core.git:reset-hard"

# ============================================================================
# Piped execution - DESTRUCTIVE ONLY
# ============================================================================

[[case]]
description = "echo piped to bash with rm (destructive)"
command = "echo 'rm -rf /' | bash"
expected = "deny"

